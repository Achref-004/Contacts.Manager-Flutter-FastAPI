name: contacts_app
description: Application de gestion de contacts avec API backend
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # HTTP client
  http: ^1.1.0
  
  # Stockage local pour le token
  shared_preferences: ^2.2.2
  
  # Image picker
  image_picker: ^1.0.5
  
  # URL launcher
  url_launcher: ^6.2.2
  
  # Font Awesome
  font_awesome_flutter: ^10.6.0
  
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/